services:
  - type: web
    name: bms-analytics
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "cd bms-portal && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
